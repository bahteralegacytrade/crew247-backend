<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crew247.id - Posting Lowongan Event</title>
  <script src="/auth-helper.js"></script>
  <style>
    :root {
      --bg-page: #0A0D0B; --bg-card: #242C2C; --bg-surface: #171d1d; --bg-quote: #393720;
      --accent: #E26D0A; --accent-hover: #f07b1a; --secondary: #688273; --secondary-light: #8da697;
      --text-white: #F4F7F5; --text-muted: #A3B5AA;
      --border-subtle: rgba(104, 130, 115, 0.28); --border-active: rgba(226, 109, 10, 0.5);
      --ok: #10b981; --danger: #f0725c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-page); color: var(--text-white);
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; padding: 24px 16px; -webkit-font-smoothing: antialiased;
    }
    .brand-top { text-align: center; margin-bottom: 14px; }
    .brand-top .logo-text {
      font-size: 20px; font-weight: 900; letter-spacing: 0.8px; color: var(--text-white);
      text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
    }
    .brand-top .logo-text span { color: var(--accent); }
    .back-link {
      display: block; text-align: center; color: var(--text-muted); font-size: 12.5px;
      text-decoration: none; margin-bottom: 16px; transition: color 0.2s;
    }
    .back-link:hover { color: var(--accent); }

    .card {
      background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 18px;
      padding: 28px 24px; width: 100%; max-width: 460px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.04);
      position: relative; margin-bottom: 20px;
    }
    .card::before, .card::after {
      content: ""; position: absolute; top: 14px; width: 7px; height: 7px; border-radius: 50%;
      background: #141818; border: 1px solid var(--border-subtle);
    }
    .card::before { left: 14px; } .card::after { right: 14px; }

    h1 { font-size: 20px; font-weight: 800; margin: 0 0 6px; letter-spacing: -0.2px; }
    h3 {
      font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--secondary);
      margin: 22px 0 10px; font-weight: 700;
    }
    p.sub { color: var(--text-muted); font-size: 13px; margin: 0 0 20px; line-height: 1.5; }
    a { color: var(--accent); }

    label {
      display: block; font-size: 11px; font-weight: 700; color: var(--secondary);
      margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.6px;
    }
    input, select {
      width: 100%; background: var(--bg-surface); border: 1px solid var(--border-subtle);
      color: var(--text-white); padding: 11px 13px; border-radius: 10px; font-size: 14.5px;
      margin-bottom: 14px; font-family: inherit; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(226,109,10,0.25); }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    button {
      width: 100%; background: var(--accent); color: #fff; border: none; padding: 13px;
      border-radius: 10px; font-weight: 800; font-size: 14.5px; cursor: pointer;
      box-shadow: 0 4px 15px rgba(226,109,10,0.35); transition: background 0.2s, transform 0.1s;
      margin-top: 4px;
    }
    button:hover { background: var(--accent-hover); }
    button:active { transform: scale(0.99); }
    button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .btn-secondary {
      background: transparent; border: 1px dashed var(--border-subtle); color: var(--text-muted);
      font-size: 13px; padding: 10px; margin-top: 2px; margin-bottom: 14px; box-shadow: none;
    }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); background: transparent; }

    .position-row {
      background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 12px;
      padding: 14px; margin-bottom: 12px; position: relative;
    }
    .position-row .btn-remove {
      position: absolute; top: 10px; right: 10px; background: transparent; border: none;
      color: var(--danger); font-size: 11.5px; width: auto; padding: 3px 7px; margin: 0;
      cursor: pointer; box-shadow: none;
    }
    .position-row .btn-remove:hover { background: rgba(240,114,92,0.1); }
    .position-row label { font-size: 10px; }
    .position-row input, .position-row select { margin-bottom: 9px; font-size: 13.5px; padding: 9px 11px; }

    .error-box {
      background: rgba(226,109,10,0.12); border: 1px solid rgba(226,109,10,0.4); color: #ff9b50;
      padding: 10px 12px; border-radius: 9px; font-size: 13px; margin-bottom: 16px; display: none; line-height: 1.4;
    }
    .hidden { display: none !important; }
    .center-card { text-align: center; }
  </style>
</head>
<body>

  <div class="brand-top">
    <a href="/index.html" class="logo-text">CREW247<span>.ID</span></a>
  </div>
  <a href="/index.html" class="back-link">&larr; Beranda</a>

  <div class="card center-card" id="state-no-login">
    <h1>Akses Ditolak</h1>
    <p class="sub">Anda belum masuk ke dalam sistem Crew247.id sebagai pembuat event.</p>
    <a href="/login.html">&larr; Silakan login dulu di sini</a>
  </div>

  <div class="card hidden" id="state-form">
    <h1>Posting Kebutuhan Kru</h1>
    <p class="sub">Buat lowongan acara baru dan tentukan posisi kru yang Anda perlukan.</p>

    <div id="error-box" class="error-box"></div>

    <form id="event-form">
      <label>Nama Acara *</label>
      <input type="text" id="nama_acara" required>

      <div class="row2">
        <div>
          <label>Tanggal Mulai *</label>
          <input type="date" id="tanggal_mulai" required>
        </div>
        <div>
          <label>Tanggal Selesai *</label>
          <input type="date" id="tanggal_selesai" required>
        </div>
      </div>

      <div class="row2">
        <div>
          <label>Jam Call Time *</label>
          <input type="time" id="jam_call_time" required>
        </div>
        <div>
          <label>Zona Waktu *</label>
          <select id="zona_waktu" required>
            <option value="WIB">WIB</option>
            <option value="WITA">WITA</option>
            <option value="WIT">WIT</option>
          </select>
        </div>
      </div>

      <label>Lokasi / Venue *</label>
      <input type="text" id="lokasi" required>

      <label>Kota *</label>
      <input type="text" id="kota" required>

      <h3>Posisi Kru yang Dibutuhkan</h3>
      <div id="positions-container"></div>
      <button type="button" class="btn-secondary" id="btn-add-position">+ Tambah Posisi Lain</button>

      <button type="submit" id="btn-submit">Posting Lowongan Acara</button>
    </form>
  </div>

<script>
  const userId = localStorage.getItem('crew247_user_id');
  const stateNoLogin = document.getElementById('state-no-login');
  const stateForm = document.getElementById('state-form');
  const errorBox = document.getElementById('error-box');
  const positionsContainer = document.getElementById('positions-container');

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = 'block';
  }

  const PERAN_OPTIONS = [
    'FOH Audio Engineer', 'Monitor Engineer', 'Lighting Designer',
    'Stage Manager', 'Backline Tech', 'VJ & LED Tech'
  ];

  function addPositionRow() {
    const row = document.createElement('div');
    row.className = 'position-row';

    const optionsHtml = PERAN_OPTIONS.map(p => `<option value="${p}">${p}</option>`).join('');

    row.innerHTML = `
      <button type="button" class="btn-remove">✕ Hapus</button>
      <label>Posisi</label>
      <select class="pos-posisi">${optionsHtml}</select>
      <label>Jumlah Dibutuhkan</label>
      <input type="number" class="pos-jumlah" value="1" min="1">
      <label>Budget / Orang (IDR)</label>
      <input type="number" class="pos-budget" placeholder="2000000">
    `;

    row.querySelector('.btn-remove').addEventListener('click', () => {
      if (positionsContainer.children.length > 1) {
        row.remove();
      } else {
        showError('Minimal harus ada satu posisi kru.');
      }
    });

    positionsContainer.appendChild(row);
  }

  if (!userId) {
    stateNoLogin.classList.remove('hidden');
  } else {
    stateForm.classList.remove('hidden');
    addPositionRow();
  }

  document.getElementById('btn-add-position').addEventListener('click', addPositionRow);

  document.getElementById('event-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';

    const tanggalMulai = document.getElementById('tanggal_mulai').value;
    const tanggalSelesai = document.getElementById('tanggal_selesai').value;

    const posisiRows = positionsContainer.querySelectorAll('.position-row');
    const posisiDibutuhkan = Array.from(posisiRows).map(row => ({
      posisi: row.querySelector('.pos-posisi').value,
      jumlah_dibutuhkan: parseInt(row.querySelector('.pos-jumlah').value) || 1,
      budget_per_orang: parseInt(row.querySelector('.pos-budget').value) || 0
    }));

    const payload = {
      pembuat_event_id: userId,
      nama_acara: document.getElementById('nama_acara').value.trim(),
      tanggal_mulai: tanggalMulai,
      tanggal_selesai: tanggalSelesai,
      jam_call_time: document.getElementById('jam_call_time').value,
      zona_waktu: document.getElementById('zona_waktu').value,
      lokasi: document.getElementById('lokasi').value.trim(),
      kota: document.getElementById('kota').value.trim(),
      posisi_dibutuhkan: posisiDibutuhkan
    };

    const btn = document.getElementById('btn-submit');
    btn.disabled = true;
    btn.textContent = 'Memposting...';

    try {
      const res = await authFetch('/api/events', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (!res.ok) {
        showError(data.error || 'Gagal memposting lowongan.');
        btn.disabled = false;
        btn.textContent = 'Posting Lowongan Acara';
        return;
      }

      const firstPositionId = data.data.posisi[0].id;

      window.location.href = `/direktori.html?tanggal_mulai=${tanggalMulai}&tanggal_selesai=${tanggalSelesai}&job_position_id=${firstPositionId}`;

    } catch (err) {
      showError('Tidak bisa terhubung ke server. Pastikan server backend menyala.');
      btn.disabled = false;
      btn.textContent = 'Posting Lowongan Acara';
    }
  });
</script>

</body>
</html>
