<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crew247.id - Posting Lowongan Event</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #12141a;
      color: #eef0f4;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #1b1e27;
      border: 1px solid #2c313c;
      border-radius: 16px;
      padding: 28px 24px;
      width: 100%;
      max-width: 460px;
    }
    h1 { color: #e9a23b; font-size: 21px; margin: 0 0 6px; }
    h3 { font-size: 13px; text-transform: uppercase; color: #9aa2b1; margin: 22px 0 10px; }
    p.sub { color: #9aa2b1; font-size: 13.5px; margin: 0 0 20px; line-height: 1.5; }
    a { color: #e9a23b; }
    label {
      display: block; font-size: 11.5px; font-weight: 600; color: #9aa2b1;
      margin-bottom: 6px; text-transform: uppercase;
    }
    input, select {
      width: 100%; background: #22262f; border: 1px solid #2c313c; color: #eef0f4;
      padding: 11px 13px; border-radius: 10px; font-size: 14.5px; margin-bottom: 14px;
      font-family: inherit;
    }
    input:focus, select:focus { outline: 2px solid #e9a23b; outline-offset: 1px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button {
      width: 100%; background: #e9a23b; color: #3a2506; border: none; padding: 13px;
      border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 4px;
    }
    button:hover { filter: brightness(1.05); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-secondary {
      background: transparent; border: 1px dashed #2c313c; color: #9aa2b1;
      font-size: 13px; padding: 10px; margin-top: 2px; margin-bottom: 14px;
    }
    .btn-secondary:hover { border-color: #e9a23b; color: #e9a23b; }
    .position-row {
      background: #22262f; border: 1px solid #2c313c; border-radius: 10px;
      padding: 12px; margin-bottom: 10px; position: relative;
    }
    .position-row .btn-remove {
      position: absolute; top: 8px; right: 8px; background: transparent; border: none;
      color: #f0725c; font-size: 12px; width: auto; padding: 2px 6px; margin: 0; cursor: pointer;
    }
    .position-row label { font-size: 10.5px; }
    .position-row input, .position-row select { margin-bottom: 8px; font-size: 13.5px; padding: 9px 11px; }
    .error-box {
      background: #2b1712; border: 1px solid #4a2a20; color: #f0725c; padding: 10px 12px;
      border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- STATE: Belum login -->
  <div class="card" id="state-no-login">
    <h1>Akses Ditolak</h1>
    <p class="sub">Anda belum masuk ke dalam sistem Crew247.id sebagai pembuat event.</p>
    <a href="/login.html">&larr; Silakan login dulu di sini</a>
  </div>

  <!-- STATE: Form -->
  <div class="card hidden" id="state-form">
    <h1>Posting Kebutuhan Kru</h1>
    <p class="sub">Buat lowongan acara baru dan tentukan posisi kru yang Anda perlukan.</p>

    <div id="error-box" class="error-box"></div>

    <form id="event-form">
      <label>Nama Acara *</label>
      <input type="text" id="nama_acara" required>

      <div class="row2">
        <div>
          <label>Tanggal Mulai *</label>
          <input type="date" id="tanggal_mulai" required>
        </div>
        <div>
          <label>Tanggal Selesai *</label>
          <input type="date" id="tanggal_selesai" required>
        </div>
      </div>

      <div class="row2">
        <div>
          <label>Jam Call Time *</label>
          <input type="time" id="jam_call_time" required>
        </div>
        <div>
          <label>Zona Waktu *</label>
          <select id="zona_waktu" required>
            <option value="WIB">WIB</option>
            <option value="WITA">WITA</option>
            <option value="WIT">WIT</option>
          </select>
        </div>
      </div>

      <label>Lokasi / Venue *</label>
      <input type="text" id="lokasi" required>

      <label>Kota *</label>
      <input type="text" id="kota" required>

      <h3>Posisi Kru yang Dibutuhkan</h3>
      <div id="positions-container"></div>
      <button type="button" class="btn-secondary" id="btn-add-position">+ Tambah Posisi Lain</button>

      <button type="submit" id="btn-submit">Posting Lowongan Acara</button>
    </form>
  </div>

<script>
  const userId = localStorage.getItem('crew247_user_id');
  const stateNoLogin = document.getElementById('state-no-login');
  const stateForm = document.getElementById('state-form');
  const errorBox = document.getElementById('error-box');
  const positionsContainer = document.getElementById('positions-container');

  if (!userId) {
    stateNoLogin.classList.remove('hidden');
  } else {
    stateForm.classList.remove('hidden');
    addPositionRow();
  }

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = 'block';
  }

  const PERAN_OPTIONS = [
    'FOH Audio Engineer', 'Monitor Engineer', 'Lighting Designer',
    'Stage Manager', 'Backline Tech', 'VJ & LED Tech'
  ];

  function addPositionRow() {
    const row = document.createElement('div');
    row.className = 'position-row';

    const optionsHtml = PERAN_OPTIONS.map(p => `<option value="${p}">${p}</option>`).join('');

    row.innerHTML = `
      <button type="button" class="btn-remove">✕ Hapus</button>
      <label>Posisi</label>
      <select class="pos-posisi">${optionsHtml}</select>
      <label>Jumlah Dibutuhkan</label>
      <input type="number" class="pos-jumlah" value="1" min="1">
      <label>Budget / Orang (IDR)</label>
      <input type="number" class="pos-budget" placeholder="2000000">
    `;

    row.querySelector('.btn-remove').addEventListener('click', () => {
      if (positionsContainer.children.length > 1) {
        row.remove();
      } else {
        showError('Minimal harus ada satu posisi kru.');
      }
    });

    positionsContainer.appendChild(row);
  }

  document.getElementById('btn-add-position').addEventListener('click', addPositionRow);

  document.getElementById('event-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';

    const tanggalMulai = document.getElementById('tanggal_mulai').value;
    const tanggalSelesai = document.getElementById('tanggal_selesai').value;

    const posisiRows = positionsContainer.querySelectorAll('.position-row');
    const posisiDibutuhkan = Array.from(posisiRows).map(row => ({
      posisi: row.querySelector('.pos-posisi').value,
      jumlah_dibutuhkan: parseInt(row.querySelector('.pos-jumlah').value) || 1,
      budget_per_orang: parseInt(row.querySelector('.pos-budget').value) || 0
    }));

    const payload = {
      pembuat_event_id: userId,
      nama_acara: document.getElementById('nama_acara').value.trim(),
      tanggal_mulai: tanggalMulai,
      tanggal_selesai: tanggalSelesai,
      jam_call_time: document.getElementById('jam_call_time').value,
      zona_waktu: document.getElementById('zona_waktu').value,
      lokasi: document.getElementById('lokasi').value.trim(),
      kota: document.getElementById('kota').value.trim(),
      posisi_dibutuhkan: posisiDibutuhkan
    };

    const btn = document.getElementById('btn-submit');
    btn.disabled = true;
    btn.textContent = 'Memposting...';

    try {
      const res = await fetch('/api/events', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (!res.ok) {
        showError(data.error || 'Gagal memposting lowongan.');
        btn.disabled = false;
        btn.textContent = 'Posting Lowongan Acara';
        return;
      }

      // Redirect ke direktori dengan tanggal yang baru diinput
      window.location.href = `/direktori.html?tanggal_mulai=${tanggalMulai}&tanggal_selesai=${tanggalSelesai}`;

    } catch (err) {
      showError('Tidak bisa terhubung ke server. Pastikan server backend menyala.');
      btn.disabled = false;
      btn.textContent = 'Posting Lowongan Acara';
    }
  });
</script>

</body>
</html>
