<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crew247.id - Dashboard Kru</title>
  <style>
    :root {
      --bg-page: #0A0D0B; --bg-card: #242C2C; --bg-surface: #171d1d;
      --accent: #E26D0A; --accent-hover: #f07b1a; --secondary: #688273;
      --text-white: #F4F7F5; --text-muted: #A3B5AA; --border-subtle: rgba(104,130,115,.28);
      --ok: #10b981; --ok-bg: rgba(16,185,129,.1); --danger: #f0725c; --danger-bg: rgba(240,114,92,.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-page); color: var(--text-white); margin: 0; padding: 24px 16px; min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 560px; margin: 0 auto; }
    .back-link { color: var(--text-muted); font-size: 13px; text-decoration: none; display: inline-block; margin-bottom: 14px; }
    .back-link:hover { color: var(--accent); }
    .header-card {
      background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 18px;
      padding: 22px 20px; margin-bottom: 18px; text-align: center; position: relative;
      box-shadow: 0 12px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04);
    }
    .header-card::before, .header-card::after {
      content: ""; position: absolute; top: 14px; width: 7px; height: 7px; border-radius: 50%;
      background: #141818; border: 1px solid var(--border-subtle);
    }
    .header-card::before { left: 14px; } .header-card::after { right: 14px; }
    h1 { font-size: 20px; font-weight: 800; color: var(--text-white); margin: 0 0 6px; letter-spacing: -.2px; }
    p.sub { color: var(--text-muted); font-size: 13.5px; margin: 0; line-height: 1.5; }
    a { color: var(--accent); }
    .offer-card {
      background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 14px;
      padding: 18px; margin-bottom: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.35);
    }
    .offer-title { font-weight: 700; font-size: 16px; margin-bottom: 4px; color: var(--text-white); }
    .offer-detail { font-size: 13px; color: var(--text-muted); margin-bottom: 3px; }
    .offer-detail b { color: var(--text-white); }
    .btn-row { display: flex; gap: 10px; margin-top: 14px; }
    .btn-row button {
      flex: 1; border: none; padding: 11px; border-radius: 9px; font-weight: 800;
      font-size: 13.5px; cursor: pointer; transition: all .15s;
    }
    .btn-terima { background: var(--ok); color: #06241a; box-shadow: 0 4px 14px rgba(16,185,129,.3); }
    .btn-terima:hover { filter: brightness(1.05); }
    .btn-tolak { background: var(--danger-bg); border: 1px solid rgba(240,114,92,.35) !important; color: var(--danger); }
    .btn-tolak:hover { background: rgba(240,114,92,.15); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .empty-state {
      text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 13.5px;
      background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 14px;
    }
    .toast {
      background: var(--ok-bg); border: 1px solid rgba(16,185,129,.35); color: var(--ok);
      padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; display: none;
    }
    .hidden { display: none; }
  </style>
  <script src="/auth-helper.js"></script>
</head>
<body>
  <div class="wrap">
    <a href="/index.html" class="back-link">&larr; Beranda</a>

    <div class="header-card hidden" id="state-no-login">
      <h1>Akses Ditolak</h1>
      <p class="sub">Anda belum masuk ke dalam sistem Crew247.id.</p>
      <p class="sub" style="margin-top:10px;"><a href="/login.html">Silakan login dulu di sini &rarr;</a></p>
    </div>

    <div id="state-content" class="hidden">
      <div class="header-card">
        <h1>Dashboard Kru</h1>
        <p class="sub">Kelola tawaran gig masuk yang sedang menunggu respons Anda.</p>
      </div>

      <div id="toast" class="toast"></div>

      <div id="offers-container"></div>
    </div>
  </div>

<script>
  const userId = localStorage.getItem('crew247_user_id');
  const stateNoLogin = document.getElementById('state-no-login');
  const stateContent = document.getElementById('state-content');
  const offersContainer = document.getElementById('offers-container');
  const toast = document.getElementById('toast');

  if (!userId) {
    stateNoLogin.classList.remove('hidden');
  } else {
    stateContent.classList.remove('hidden');
    loadOffers();
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 4000);
  }

  function fmtRupiah(angka) { return 'Rp ' + Number(angka).toLocaleString('id-ID'); }
  function fmtTanggal(d) {
    const dt = new Date(d + 'T00:00:00');
    return dt.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  async function loadOffers() {
    offersContainer.innerHTML = '<div class="empty-state">Memuat tawaran...</div>';

    try {
      const res = await authFetch('/api/applications/crew/' + userId);
      const data = await res.json();

      if (!res.ok) {
        offersContainer.innerHTML = `<div class="empty-state">Gagal memuat tawaran.</div>`;
        return;
      }

      if (data.data.length === 0) {
        offersContainer.innerHTML = `<div class="empty-state">Belum ada tawaran gig yang menunggu respons Anda.</div>`;
        return;
      }

      offersContainer.innerHTML = data.data.map(renderOfferCard).join('');

      document.querySelectorAll('.btn-terima').forEach(btn => {
        btn.addEventListener('click', () => respond(btn.dataset.appId, 'diterima'));
      });
      document.querySelectorAll('.btn-tolak').forEach(btn => {
        btn.addEventListener('click', () => respond(btn.dataset.appId, 'ditolak'));
      });

    } catch (err) {
      offersContainer.innerHTML = `<div class="empty-state">Tidak bisa terhubung ke server.</div>`;
    }
  }

  function renderOfferCard(offer) {
    return `
      <div class="offer-card" id="offer-${offer.application_id}">
        <div class="offer-title">${offer.nama_acara}</div>
        <div class="offer-detail"><b>Posisi:</b> ${offer.posisi}</div>
        <div class="offer-detail"><b>Tanggal:</b> ${fmtTanggal(offer.tanggal_mulai)} - ${fmtTanggal(offer.tanggal_selesai)}</div>
        <div class="offer-detail"><b>Lokasi:</b> ${offer.lokasi}, ${offer.kota}</div>
        <div class="offer-detail"><b>Budget:</b> ${fmtRupiah(offer.budget_per_orang)}</div>
        <div class="btn-row">
          <button class="btn-terima" data-app-id="${offer.application_id}">Terima</button>
          <button class="btn-tolak" data-app-id="${offer.application_id}">Tolak</button>
        </div>
      </div>
    `;
  }

  async function respond(applicationId, keputusan) {
    const card = document.getElementById('offer-' + applicationId);
    const buttons = card.querySelectorAll('button');
    buttons.forEach(b => b.disabled = true);

    try {
      const res = await authFetch(`/api/applications/${applicationId}/respond`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status_keputusan: keputusan })
      });
      const data = await res.json();

      if (!res.ok) {
        alert(data.error || 'Gagal mengirim respons.');
        buttons.forEach(b => b.disabled = false);
        return;
      }

      showToast(keputusan === 'diterima' ? 'Tawaran diterima! Jadwal Anda sudah terkunci.' : 'Tawaran ditolak.');
      card.remove();

      if (offersContainer.children.length === 0) {
        offersContainer.innerHTML = `<div class="empty-state">Belum ada tawaran gig yang menunggu respons Anda.</div>`;
      }

    } catch (err) {
      alert('Tidak bisa terhubung ke server.');
      buttons.forEach(b => b.disabled = false);
    }
  }
</script>

</body>
</html>
