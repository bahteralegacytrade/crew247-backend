<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crew247.id - Beri Rating Kru</title>
<style>
  :root {
    --bg-page: #0A0D0B; --bg-card: #242C2C; --bg-surface: #171d1d;
    --accent: #E26D0A; --accent-hover: #f07b1a; --secondary: #688273;
    --text-white: #F4F7F5; --text-muted: #A3B5AA; --border-subtle: rgba(104,130,115,.28);
    --ok: #10b981; --ok-bg: rgba(16,185,129,.1); --gold: #FBBF24;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg-page); color: var(--text-white); margin: 0; padding: 24px 16px; min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  .back-link { color: var(--text-muted); font-size: 13px; text-decoration: none; display: inline-block; margin-bottom: 14px; }
  .back-link:hover { color: var(--accent); }
  .header-card {
    background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 18px;
    padding: 22px 20px; margin-bottom: 18px; text-align: center; position: relative;
    box-shadow: 0 12px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04);
  }
  .header-card::before, .header-card::after {
    content: ""; position: absolute; top: 14px; width: 7px; height: 7px; border-radius: 50%;
    background: #141818; border: 1px solid var(--border-subtle);
  }
  .header-card::before { left: 14px; } .header-card::after { right: 14px; }
  h1 { color: var(--text-white); font-size: 20px; font-weight: 800; margin: 0 0 6px; letter-spacing: -.2px; }
  p.sub { color: var(--text-muted); font-size: 13.5px; margin: 0; line-height: 1.5; }
  a { color: var(--accent); }
  .rate-card {
    background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 14px;
    padding: 18px; margin-bottom: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.35);
  }
  .rate-title { font-weight: 700; font-size: 15.5px; margin-bottom: 4px; color: var(--text-white); }
  .rate-detail { font-size: 12.5px; color: var(--text-muted); margin-bottom: 2px; }
  .rate-detail b { color: var(--text-white); }
  .stars { display: flex; gap: 6px; margin: 14px 0 12px; justify-content: center; }
  .star { font-size: 32px; cursor: pointer; color: var(--border-subtle); transition: color .15s; user-select: none; }
  .star.active { color: var(--gold); }
  textarea {
    width: 100%; background: var(--bg-surface); border: 1px solid var(--border-subtle); color: var(--text-white);
    padding: 10px 12px; border-radius: 9px; font-size: 13.5px; font-family: inherit;
    resize: vertical; min-height: 60px; margin-bottom: 12px; outline: none; transition: border-color .2s;
  }
  textarea:focus { border-color: var(--accent); }
  button {
    width: 100%; background: var(--accent); color: #fff; border: none; padding: 11px;
    border-radius: 9px; font-weight: 800; font-size: 14px; cursor: pointer;
    box-shadow: 0 4px 14px rgba(226,109,10,.3); transition: background .2s, transform .1s;
  }
  button:hover { background: var(--accent-hover); }
  button:active { transform: scale(.99); }
  button:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .empty-state {
    text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 13.5px;
    background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 14px;
  }
  .toast { background: var(--ok-bg); border: 1px solid rgba(16,185,129,.35); color: var(--ok); padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; display: none; }
  .hidden { display: none; }
</style>
<script src="/auth-helper.js"></script>
</head>
<body>
  <div class="wrap">
    <a class="back-link" href="/index.html">← Beranda</a>

    <div class="header-card hidden" id="state-no-login">
      <h1>Akses Ditolak</h1>
      <p class="sub">Anda belum masuk ke dalam sistem Crew247.id.</p>
      <p class="sub" style="margin-top:10px;"><a href="/login.html">Silakan login dulu di sini &rarr;</a></p>
    </div>

    <div id="state-content" class="hidden">
      <div class="header-card">
        <h1>Beri Rating Kru</h1>
        <p class="sub">Berikan ulasan dan penilaian bagi kru yang telah menyelesaikan tugas pada acara Anda.</p>
      </div>

      <div id="toast" class="toast"></div>

      <div id="rating-container"></div>
    </div>
  </div>

<script>
  const userId = localStorage.getItem('crew247_user_id');
  const stateNoLogin = document.getElementById('state-no-login');
  const stateContent = document.getElementById('state-content');
  const ratingContainer = document.getElementById('rating-container');
  const toast = document.getElementById('toast');

  if (!userId) {
    stateNoLogin.classList.remove('hidden');
  } else {
    stateContent.classList.remove('hidden');
    loadPendingRatings();
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 4000);
  }

  function fmtTanggal(d) {
    const dt = new Date(d + 'T00:00:00');
    return dt.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  async function loadPendingRatings() {
    ratingContainer.innerHTML = '<div class="empty-state">Memuat data...</div>';

    try {
      const res = await authFetch(`/api/events/pembuat/${userId}/selesai`);
      const data = await res.json();

      if (!res.ok) {
        ratingContainer.innerHTML = `<div class="empty-state">Gagal memuat data rating.</div>`;
        return;
      }

      if (data.data.length === 0) {
        ratingContainer.innerHTML = `<div class="empty-state">Tidak ada gig yang perlu dirating saat ini.</div>`;
        return;
      }

      ratingContainer.innerHTML = data.data.map((item, idx) => renderRateCard(item, idx)).join('');

      data.data.forEach((item, idx) => {
        const starsEl = document.querySelectorAll(`#rate-${idx} .star`);
        starsEl.forEach(starEl => {
          starEl.addEventListener('click', () => setStars(idx, parseInt(starEl.dataset.value)));
        });
      });

      document.querySelectorAll('.btn-submit-rating').forEach(btn => {
        btn.addEventListener('click', () => submitRating(btn, data.data));
      });

    } catch (err) {
      ratingContainer.innerHTML = `<div class="empty-state">Tidak bisa terhubung ke server.</div>`;
    }
  }

  function renderRateCard(item, idx) {
    const starsHtml = [1, 2, 3, 4, 5].map(n =>
      `<span class="star active" data-value="${n}">★</span>`
    ).join('');

    return `
      <div class="rate-card" id="rate-${idx}" data-job-id="${item.job_id}" data-crew-id="${item.crew_id}" data-score="5">
        <div class="rate-title">${item.nama_acara}</div>
        <div class="rate-detail"><b>Kru:</b> ${item.nama_lengkap} (${item.nama_panggung}) &middot; ${item.peran_utama}</div>
        <div class="rate-detail"><b>Tanggal:</b> ${fmtTanggal(item.tanggal_mulai)} - ${fmtTanggal(item.tanggal_selesai)}</div>
        <div class="stars">${starsHtml}</div>
        <textarea placeholder="Komentar (opsional)"></textarea>
        <button class="btn-submit-rating">Kirim Rating</button>
      </div>
    `;
  }

  function setStars(idx, value) {
    const card = document.getElementById(`rate-${idx}`);
    card.dataset.score = value;
    const stars = card.querySelectorAll('.star');
    stars.forEach(s => {
      const starValue = parseInt(s.dataset.value);
      s.classList.toggle('active', starValue <= value);
    });
  }

  async function submitRating(btn, allData) {
    const card = btn.closest('.rate-card');
    const jobId = card.dataset.jobId;
    const crewId = card.dataset.crewId;
    const skor = parseInt(card.dataset.score) || 5;
    const komentar = card.querySelector('textarea').value.trim();

    btn.disabled = true;
    btn.textContent = 'Mengirim...';

    try {
      const res = await authFetch('/api/ratings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          job_id: jobId,
          crew_id: crewId,
          skor: skor,
          komentar: komentar || null
        })
      });
      const data = await res.json();

      if (!res.ok) {
        alert(data.error || 'Gagal mengirim rating.');
        btn.disabled = false;
        btn.textContent = 'Kirim Rating';
        return;
      }

      showToast('Rating berhasil dikirim! Reputasi kru sudah diperbarui.');
      card.remove();

      if (ratingContainer.children.length === 0) {
        ratingContainer.innerHTML = `<div class="empty-state">Tidak ada gig yang perlu dirating saat ini.</div>`;
      }

    } catch (err) {
      alert('Tidak bisa terhubung ke server.');
      btn.disabled = false;
      btn.textContent = 'Kirim Rating';
    }
  }
</script>
</body>
</html>
