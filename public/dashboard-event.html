<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crew247.id - Dashboard Event</title>
<style>
  :root {
    --bg-page: #0A0D0B; --bg-card: #242C2C; --bg-surface: #171d1d;
    --accent: #E26D0A; --accent-hover: #f07b1a; --secondary: #688273;
    --text-white: #F4F7F5; --text-muted: #A3B5AA; --border-subtle: rgba(104,130,115,.28);
    --ok: #10b981; --ok-bg: rgba(16,185,129,.1); --danger: #f0725c; --danger-bg: rgba(240,114,92,.08);
    --warn: #FBBF24; --warn-bg: rgba(251,191,36,.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg-page); color: var(--text-white); margin: 0; padding: 24px 16px; min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  .back-link { color: var(--text-muted); font-size: 13px; text-decoration: none; display: inline-block; margin-bottom: 14px; }
  .back-link:hover { color: var(--accent); }
  .box {
    background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 16px;
    padding: 20px; margin-bottom: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.35);
  }
  h1 { color: var(--text-white); font-size: 20px; font-weight: 800; margin: 0 0 4px; letter-spacing: -.2px; }
  .sub { color: var(--text-muted); font-size: 13.5px; margin: 0; line-height: 1.5; }
  a { color: var(--accent); text-decoration: none; }
  .ev-title { font-weight: 700; font-size: 16.5px; color: var(--text-white); }
  .ev-meta { font-size: 12.5px; color: var(--text-muted); margin-top: 3px; }
  .badge { display: inline-block; font-size: 10.5px; font-weight: 800; padding: 3px 9px; border-radius: 100px; text-transform: uppercase; letter-spacing: .3px; }
  .b-menunggu { background: var(--warn-bg); color: var(--warn); }
  .b-diterima { background: var(--ok-bg); color: var(--ok); }
  .b-ditolak { background: var(--danger-bg); color: var(--danger); }
  .b-abu { background: var(--bg-surface); color: var(--text-muted); border: 1px solid var(--border-subtle); }
  .pos { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 12px; padding: 12px 14px; margin-top: 12px; }
  .pos-head { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; font-weight: 700; color: var(--text-white); }
  .pos-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .app-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--border-subtle); font-size: 13px; margin-top: 8px; }
  .app-row:first-of-type { margin-top: 10px; }
  .app-name { font-weight: 600; color: var(--text-white); }
  .app-sumber { font-size: 11px; color: var(--text-muted); }
  .btn { border: none; border-radius: 8px; padding: 8px 12px; font-size: 12.5px; font-weight: 800; cursor: pointer; text-decoration: none; display: inline-block; transition: filter .15s; }
  .btn-pick { background: var(--accent); color: #fff; margin-top: 10px; box-shadow: 0 4px 12px rgba(226,109,10,.3); }
  .btn-pick:hover { filter: brightness(1.05); }
  .btn-cancel { background: var(--danger-bg); border: 1px solid rgba(240,114,92,.35); color: var(--danger); padding: 5px 9px; font-size: 11.5px; }
  .btn-cancel:hover { background: rgba(240,114,92,.16); }
  .full { font-size: 12px; color: var(--ok); margin-top: 10px; font-weight: 600; }
  .empty { text-align: center; color: var(--text-muted); font-size: 13.5px; padding: 30px 10px; }
  .toast { background: var(--ok-bg); border: 1px solid rgba(16,185,129,.35); color: var(--ok); padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; display: none; }
  .hidden { display: none; }
</style>
<script src="/auth-helper.js"></script>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="/index.html">← Beranda</a>

  <div class="box hidden" id="state-no-login">
    <h1>Akses Ditolak</h1>
    <p class="sub" id="no-login-msg">Anda belum masuk ke dalam sistem Crew247.id.</p>
    <p class="sub" style="margin-top:10px;"><a href="/login.html">Silakan login dulu di sini →</a></p>
  </div>

  <div id="state-content" class="hidden">
    <div class="box" style="text-align:center;">
      <h1>Dashboard Event</h1>
      <p class="sub">Pantau event yang Anda posting, posisi yang dibutuhkan, dan status tiap pelamar.</p>
      <p style="margin:14px 0 0;"><a class="btn btn-pick" style="margin-top:0;" href="/posting-event.html">+ Posting Event Baru</a></p>
    </div>
    <div id="toast" class="toast"></div>
    <div id="list"></div>
  </div>
</div>

<script>
  const userId = localStorage.getItem('crew247_user_id');
  const role = localStorage.getItem('crew247_role');
  const list = document.getElementById('list');
  const toast = document.getElementById('toast');
  const today = new Date().toISOString().split('T')[0];

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function rp(n) { return 'Rp ' + Number(n).toLocaleString('id-ID'); }
  function tgl(d) { return new Date(d + 'T00:00:00').toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }); }
  function showToast(msg) {
    toast.textContent = msg;
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 4000);
  }

  function statusView(a) {
    let s = a.status;
    if (s === 'menunggu' && (Date.now() - new Date(a.created_at).getTime()) > 24 * 3600 * 1000) s = 'expired';
    const map = {
      menunggu: ['b-menunggu', 'Menunggu'],
      diterima: ['b-diterima', 'Diterima'],
      ditolak: ['b-ditolak', 'Ditolak'],
      expired: ['b-abu', 'Kedaluwarsa'],
      dibatalkan: ['b-abu', 'Dibatalkan']
    };
    return map[s] || ['b-abu', s];
  }

  function renderPelamar(a, past) {
    const [cls, label] = statusView(a);
    const cancelBtn = (a.status === 'diterima' && !past)
      ? `<button class="btn btn-cancel" data-cancel="${esc(a.id)}">Batalkan</button>` : '';
    return `
      <div class="app-row">
        <div>
          <div class="app-name">${esc(a.nama_lengkap)} <span style="font-weight:400;color:var(--text-muted);">(${esc(a.nama_panggung)})</span></div>
          <div class="app-sumber">${a.sumber === 'colek_langsung' ? 'Dipilih langsung' : 'Melamar'}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;"><span class="badge ${cls}">${label}</span>${cancelBtn}</div>
      </div>`;
  }

  function renderPosisi(ev, p, past) {
    const penuh = p.jumlah_terisi >= p.jumlah_dibutuhkan;
    let aksi = '';
    if (past) aksi = '';
    else if (penuh) aksi = '<div class="full">✓ Slot terpenuhi</div>';
    else {
      const url = `/direktori.html?tanggal_mulai=${ev.tanggal_mulai}&tanggal_selesai=${ev.tanggal_selesai}&job_position_id=${p.id}`;
      aksi = `<a class="btn btn-pick" href="${url}">⚡ Pilih Kru untuk Posisi Ini</a>`;
    }
    const pelamar = p.pelamar.length ? p.pelamar.map(a => renderPelamar(a, past)).join('') : '<div class="pos-sub" style="margin-top:8px;">Belum ada kru yang dipilih.</div>';
    return `
      <div class="pos">
        <div class="pos-head"><span>${esc(p.posisi)}</span><span>${p.jumlah_terisi}/${p.jumlah_dibutuhkan} terisi</span></div>
        <div class="pos-sub">Budget ${rp(p.budget_per_orang)} / orang</div>
        ${pelamar}
        ${aksi}
      </div>`;
  }

  function renderEvent(ev) {
    const past = ev.tanggal_selesai < today;
    return `
      <div class="box">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;">
          <div class="ev-title">${esc(ev.nama_acara)}</div>
          ${past ? '<span class="badge b-abu">Selesai</span>' : '<span class="badge b-diterima">Aktif</span>'}
        </div>
        <div class="ev-meta">${tgl(ev.tanggal_mulai)} - ${tgl(ev.tanggal_selesai)} · ${esc(ev.lokasi)}, ${esc(ev.kota)}</div>
        ${ev.posisi.map(p => renderPosisi(ev, p, past)).join('')}
      </div>`;
  }

  async function load() {
    list.innerHTML = '<div class="empty">Memuat data...</div>';
    try {
      const res = await authFetch('/api/events/pembuat/' + userId);
      const data = await res.json();
      if (!res.ok) { list.innerHTML = '<div class="empty">Gagal memuat data event.</div>'; return; }
      list.innerHTML = data.data.length
        ? data.data.map(renderEvent).join('')
        : '<div class="empty">Belum ada event yang Anda posting.</div>';
    } catch (err) {
      list.innerHTML = '<div class="empty">Tidak bisa terhubung ke server.</div>';
    }
  }

  async function cancelApp(id) {
    if (!confirm('Batalkan gig ini? Jadwal kru akan dibuka kembali.')) return;
    try {
      const res = await authFetch('/api/applications/' + id + '/cancel', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: '{}' });
      const data = await res.json();
      if (!res.ok) { alert(data.error || 'Gagal membatalkan gig.'); return; }
      showToast('Gig dibatalkan. Jadwal kru sudah dibuka kembali.');
      load();
    } catch (err) { alert('Tidak bisa terhubung ke server.'); }
  }

  list.addEventListener('click', e => {
    const b = e.target.closest('[data-cancel]');
    if (b) cancelApp(b.dataset.cancel);
  });

  if (!userId) {
    document.getElementById('state-no-login').classList.remove('hidden');
  } else if (role && role !== 'pembuat_event') {
    document.getElementById('no-login-msg').textContent = 'Halaman ini khusus akun Pembuat Event.';
    document.getElementById('state-no-login').classList.remove('hidden');
  } else {
    document.getElementById('state-content').classList.remove('hidden');
    load();
  }
</script>
</body>
</html>
