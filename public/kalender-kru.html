<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crew247.id - Kalender Saya</title>
<style>
  :root {
    --bg-page: #0A0D0B; --bg-card: #242C2C; --bg-surface: #171d1d;
    --accent: #E26D0A; --accent-hover: #f07b1a; --secondary: #688273;
    --text-white: #F4F7F5; --text-muted: #A3B5AA; --border-subtle: rgba(104,130,115,.28);
    --ok: #10b981; --ok-bg: rgba(16,185,129,.1); --danger: #f0725c; --danger-bg: rgba(240,114,92,.1);
    --gig-bg: rgba(226,109,10,.16); --gig-text: var(--accent);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg-page); color: var(--text-white); margin: 0; padding: 24px 16px; min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  .back-link { color: var(--text-muted); font-size: 13px; text-decoration: none; display: inline-block; margin-bottom: 14px; }
  .back-link:hover { color: var(--accent); }
  .box {
    background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 16px;
    padding: 20px; margin-bottom: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.35);
  }
  h1 { color: var(--text-white); font-size: 19px; font-weight: 800; margin: 0 0 4px; letter-spacing: -.2px; }
  .sub { color: var(--text-muted); font-size: 13px; margin: 0 0 4px; line-height: 1.5; }
  a { color: var(--accent); }

  .nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .nav button {
    background: var(--bg-surface); border: 1px solid var(--border-subtle); color: var(--text-white);
    width: 34px; height: 34px; border-radius: 9px; font-size: 15px; cursor: pointer;
    box-shadow: none; transition: border-color .2s;
  }
  .nav button:hover { border-color: var(--accent); }
  .nav .month-label { font-weight: 800; font-size: 15px; color: var(--text-white); }

  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .dow { text-align: center; font-size: 10px; color: var(--secondary); font-weight: 700; text-transform: uppercase; padding-bottom: 4px; letter-spacing: .3px; }
  .cell {
    aspect-ratio: 1; border-radius: 9px; display: flex; align-items: center; justify-content: center;
    font-size: 12.5px; cursor: default; border: 1px solid transparent; position: relative;
  }
  .cell.empty { visibility: hidden; }
  .cell.free { background: var(--bg-surface); color: var(--text-muted); cursor: pointer; border-color: var(--border-subtle); }
  .cell.free:hover { border-color: var(--ok); }
  .cell.gig { background: var(--gig-bg); color: var(--gig-text); font-weight: 800; }
  .cell.manual { background: var(--danger-bg); color: var(--danger); font-weight: 800; cursor: pointer; }
  .cell.manual:hover { border-color: var(--danger); }
  .cell.today { box-shadow: inset 0 0 0 2px var(--accent); }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 14px; font-size: 11.5px; color: var(--text-muted); }
  .legend .dot { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

  .detail-box { display: none; margin-top: 14px; padding: 12px 14px; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 10px; font-size: 13px; }
  .detail-box b { display: block; margin-bottom: 4px; color: var(--text-white); }
  .detail-box button {
    margin-top: 8px; background: transparent; border: 1px solid rgba(240,114,92,.35); color: var(--danger);
    padding: 7px 11px; border-radius: 7px; font-size: 12px; cursor: pointer; width: auto; box-shadow: none;
  }
  .detail-box .btn-block { border-color: rgba(16,185,129,.35); color: var(--ok); }

  .toast { background: var(--ok-bg); border: 1px solid rgba(16,185,129,.35); color: var(--ok); padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; display: none; }
  .hidden { display: none; }
</style>
<script src="/auth-helper.js"></script>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="/index.html">← Beranda</a>

  <div class="box hidden" id="state-no-login">
    <h1>Akses Ditolak</h1>
    <p class="sub">Halaman ini khusus akun Kru. Silakan login dulu.</p>
    <p class="sub"><a href="/login.html">Login di sini →</a></p>
  </div>

  <div id="state-content" class="hidden">
    <div class="box">
      <h1>Kalender Saya</h1>
      <p class="sub">Klik tanggal kosong untuk memblokir, klik tanggal terblokir untuk membukanya lagi.</p>
    </div>

    <div id="toast" class="toast"></div>

    <div class="box">
      <div class="nav">
        <button id="btn-prev">←</button>
        <div class="month-label" id="month-label"></div>
        <button id="btn-next">→</button>
      </div>
      <div class="grid" id="dow-row"></div>
      <div class="grid" id="cal-grid" style="margin-top:5px;"></div>

      <div class="legend">
        <span><span class="dot" style="background:var(--gig-bg);"></span>Bertugas (gig)</span>
        <span><span class="dot" style="background:var(--danger-bg);"></span>Diblokir manual</span>
        <span><span class="dot" style="background:var(--bg-surface);"></span>Kosong</span>
      </div>

      <div class="detail-box" id="detail-box"></div>
    </div>
  </div>
</div>

<script>
  const userId = localStorage.getItem('crew247_user_id');
  const stateNoLogin = document.getElementById('state-no-login');
  const stateContent = document.getElementById('state-content');
  const monthLabel = document.getElementById('month-label');
  const calGrid = document.getElementById('cal-grid');
  const dowRow = document.getElementById('dow-row');
  const detailBox = document.getElementById('detail-box');
  const toast = document.getElementById('toast');

  const DOW = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
  const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

  let viewYear, viewMonth;
  let scheduleData = [];

  function pad(n) { return String(n).padStart(2, '0'); }
  function toISO(y, m, d) { return `${y}-${pad(m + 1)}-${pad(d)}`; }
  function todayISO() { const t = new Date(); return toISO(t.getFullYear(), t.getMonth(), t.getDate()); }

  function showToast(msg) {
    toast.textContent = msg;
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 4000);
  }

  function findEntry(iso) {
    return scheduleData.find(s => iso >= s.tanggal_mulai && iso <= s.tanggal_selesai);
  }

  function renderDow() {
    dowRow.innerHTML = DOW.map(d => `<div class="dow">${d}</div>`).join('');
  }

  function renderCalendar() {
    monthLabel.textContent = `${BULAN[viewMonth]} ${viewYear}`;
    detailBox.style.display = 'none';

    const firstDay = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const today = todayISO();

    let html = '';
    for (let i = 0; i < firstDay; i++) html += `<div class="cell empty"></div>`;

    for (let d = 1; d <= daysInMonth; d++) {
      const iso = toISO(viewYear, viewMonth, d);
      const entry = findEntry(iso);
      let cls = 'free';
      if (entry) cls = entry.sumber === 'otomatis_gig' ? 'gig' : 'manual';
      if (iso === today) cls += ' today';
      html += `<div class="cell ${cls}" data-date="${iso}">${d}</div>`;
    }

    calGrid.innerHTML = html;

    calGrid.querySelectorAll('.cell:not(.empty)').forEach(cell => {
      cell.addEventListener('click', () => onDateClick(cell.dataset.date));
    });
  }

  function onDateClick(iso) {
    const entry = findEntry(iso);

    if (entry && entry.sumber === 'otomatis_gig') {
      detailBox.style.display = 'block';
      detailBox.innerHTML = `<b>${formatTgl(iso)}</b>Bertugas untuk: <b style="display:inline;">${entry.nama_acara || 'Event'}</b><br><span style="color:var(--text-muted); font-size:12px;">Jadwal dari gig hanya bisa dibuka lewat pembatalan oleh pembuat event.</span>`;
      return;
    }

    if (entry && entry.sumber === 'manual_blokir') {
      detailBox.style.display = 'block';
      detailBox.innerHTML = `<b>${formatTgl(iso)}</b>Tanggal ini Anda blokir manual.<br><button id="btn-unblock">Buka Blokir Ini</button>`;
      document.getElementById('btn-unblock').addEventListener('click', () => unblockDate(entry.id));
      return;
    }

    detailBox.style.display = 'block';
    detailBox.innerHTML = `<b>${formatTgl(iso)}</b>Tanggal ini kosong.<br><button class="btn-block" id="btn-block">Blokir Tanggal Ini</button>`;
    document.getElementById('btn-block').addEventListener('click', () => blockDate(iso));
  }

  function formatTgl(iso) {
    return new Date(iso + 'T00:00:00').toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  }

  async function blockDate(iso) {
    try {
      const res = await authFetch('/api/schedule/manual-block', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tanggal_mulai: iso, tanggal_selesai: iso })
      });
      const data = await res.json();
      if (!res.ok) { alert(data.error || 'Gagal memblokir tanggal.'); return; }
      showToast('Tanggal berhasil diblokir.');
      loadSchedule();
    } catch (err) { alert('Tidak bisa terhubung ke server.'); }
  }

  async function unblockDate(id) {
    try {
      const res = await authFetch('/api/schedule/' + id, { method: 'DELETE' });
      const data = await res.json();
      if (!res.ok) { alert(data.error || 'Gagal membuka blokir.'); return; }
      showToast('Blokir tanggal dibuka.');
      loadSchedule();
    } catch (err) { alert('Tidak bisa terhubung ke server.'); }
  }

  async function loadSchedule() {
    const bulan = `${viewYear}-${pad(viewMonth + 1)}`;
    try {
      const res = await authFetch(`/api/schedule/${userId}?bulan=${bulan}`);
      const data = await res.json();
      scheduleData = res.ok ? data.data : [];
    } catch (err) {
      scheduleData = [];
    }
    renderCalendar();
  }

  document.getElementById('btn-prev').addEventListener('click', () => {
    viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    loadSchedule();
  });
  document.getElementById('btn-next').addEventListener('click', () => {
    viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    loadSchedule();
  });

  if (!userId) {
    stateNoLogin.classList.remove('hidden');
  } else {
    stateContent.classList.remove('hidden');
    const now = new Date();
    viewYear = now.getFullYear();
    viewMonth = now.getMonth();
    renderDow();
    loadSchedule();
  }
</script>
</body>
</html>
