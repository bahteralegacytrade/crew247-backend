<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crew247.id - Kalender Saya</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #12141a; color: #eef0f4; margin: 0; padding: 20px; min-height: 100vh; }
  .wrap { max-width: 480px; margin: 0 auto; }
  .back { color: #9aa2b1; font-size: 13px; text-decoration: none; display: inline-block; margin-bottom: 10px; }
  .box { background: #1b1e27; border: 1px solid #2c313c; border-radius: 16px; padding: 20px; margin-bottom: 14px; }
  h1 { color: #e9a23b; font-size: 20px; margin: 0 0 4px; }
  .sub { color: #9aa2b1; font-size: 13px; margin: 0 0 4px; line-height: 1.5; }
  a { color: #e9a23b; }

  .nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .nav button { background: #22262f; border: 1px solid #2c313c; color: #eef0f4; width: 34px; height: 34px; border-radius: 9px; font-size: 15px; cursor: pointer; }
  .nav button:hover { border-color: #e9a23b; }
  .nav .month-label { font-weight: 700; font-size: 15px; }

  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .dow { text-align: center; font-size: 10.5px; color: #6b7078; font-weight: 700; text-transform: uppercase; padding-bottom: 4px; }
  .cell {
    aspect-ratio: 1; border-radius: 9px; display: flex; align-items: center; justify-content: center;
    font-size: 12.5px; cursor: default; border: 1px solid transparent; position: relative;
  }
  .cell.empty { visibility: hidden; }
  .cell.free { background: #22262f; color: #9aa2b1; cursor: pointer; }
  .cell.free:hover { border-color: #37c98f; }
  .cell.gig { background: #33270c; color: #e9a23b; font-weight: 700; }
  .cell.manual { background: #2b1712; color: #f0725c; font-weight: 700; cursor: pointer; }
  .cell.manual:hover { border-color: #f0725c; }
  .cell.today { box-shadow: inset 0 0 0 2px #e9a23b; }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 14px; font-size: 11.5px; color: #9aa2b1; }
  .legend .dot { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

  .detail-box { display: none; margin-top: 14px; padding: 12px 14px; background: #22262f; border: 1px solid #2c313c; border-radius: 10px; font-size: 13px; }
  .detail-box b { display: block; margin-bottom: 4px; }
  .detail-box button { margin-top: 8px; background: transparent; border: 1px solid #4a2a20; color: #f0725c; padding: 7px 11px; border-radius: 7px; font-size: 12px; cursor: pointer; }
  .detail-box .btn-block { border-color: #37c98f; color: #37c98f; }

  .toast { background: #12271f; border: 1px solid #1e4635; color: #5fd996; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; display: none; }
  .hidden { display: none; }
</style>
<script src="/auth-helper.js"></script>
</head>
<body>
<div class="wrap">
  <a class="back" href="/index.html">← Beranda</a>

  <div class="box hidden" id="state-no-login">
    <h1>Akses Ditolak</h1>
    <p class="sub">Halaman ini khusus akun Kru. Silakan login dulu.</p>
    <p class="sub"><a href="/login.html">Login di sini →</a></p>
  </div>

  <div id="state-content" class="hidden">
    <div class="box">
      <h1>Kalender Saya</h1>
      <p class="sub">Klik tanggal kosong untuk memblokir, klik tanggal terblokir untuk membukanya lagi.</p>
    </div>

    <div id="toast" class="toast"></div>

    <div class="box">
      <div class="nav">
        <button id="btn-prev">←</button>
        <div class="month-label" id="month-label"></div>
        <button id="btn-next">→</button>
      </div>
      <div class="grid" id="dow-row"></div>
      <div class="grid" id="cal-grid" style="margin-top:5px;"></div>

      <div class="legend">
        <span><span class="dot" style="background:#33270c;"></span>Bertugas (gig)</span>
        <span><span class="dot" style="background:#2b1712;"></span>Diblokir manual</span>
        <span><span class="dot" style="background:#22262f;"></span>Kosong</span>
      </div>

      <div class="detail-box" id="detail-box"></div>
    </div>
  </div>
</div>

<script>
  const userId = localStorage.getItem('crew247_user_id');
  const stateNoLogin = document.getElementById('state-no-login');
  const stateContent = document.getElementById('state-content');
  const monthLabel = document.getElementById('month-label');
  const calGrid = document.getElementById('cal-grid');
  const dowRow = document.getElementById('dow-row');
  const detailBox = document.getElementById('detail-box');
  const toast = document.getElementById('toast');

  const DOW = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
  const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

  let viewYear, viewMonth; // viewMonth: 0-11
  let scheduleData = [];

  function pad(n) { return String(n).padStart(2, '0'); }
  function toISO(y, m, d) { return `${y}-${pad(m + 1)}-${pad(d)}`; }
  function todayISO() { const t = new Date(); return toISO(t.getFullYear(), t.getMonth(), t.getDate()); }

  function showToast(msg) {
    toast.textContent = msg;
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 4000);
  }

  function findEntry(iso) {
    return scheduleData.find(s => iso >= s.tanggal_mulai && iso <= s.tanggal_selesai);
  }

  function renderDow() {
    dowRow.innerHTML = DOW.map(d => `<div class="dow">${d}</div>`).join('');
  }

  function renderCalendar() {
    monthLabel.textContent = `${BULAN[viewMonth]} ${viewYear}`;
    detailBox.style.display = 'none';

    const firstDay = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const today = todayISO();

    let html = '';
    for (let i = 0; i < firstDay; i++) html += `<div class="cell empty"></div>`;

    for (let d = 1; d <= daysInMonth; d++) {
      const iso = toISO(viewYear, viewMonth, d);
      const entry = findEntry(iso);
      let cls = 'free';
      if (entry) cls = entry.sumber === 'otomatis_gig' ? 'gig' : 'manual';
      if (iso === today) cls += ' today';
      html += `<div class="cell ${cls}" data-date="${iso}">${d}</div>`;
    }

    calGrid.innerHTML = html;

    calGrid.querySelectorAll('.cell:not(.empty)').forEach(cell => {
      cell.addEventListener('click', () => onDateClick(cell.dataset.date));
    });
  }

  function onDateClick(iso) {
    const entry = findEntry(iso);

    if (entry && entry.sumber === 'otomatis_gig') {
      detailBox.style.display = 'block';
      detailBox.innerHTML = `<b>${formatTgl(iso)}</b>Bertugas untuk: <b style="display:inline;">${entry.nama_acara || 'Event'}</b><br><span style="color:#9aa2b1; font-size:12px;">Jadwal dari gig hanya bisa dibuka lewat pembatalan oleh pembuat event.</span>`;
      return;
    }

    if (entry && entry.sumber === 'manual_blokir') {
      detailBox.style.display = 'block';
      detailBox.innerHTML = `<b>${formatTgl(iso)}</b>Tanggal ini Anda blokir manual.<br><button id="btn-unblock">Buka Blokir Ini</button>`;
      document.getElementById('btn-unblock').addEventListener('click', () => unblockDate(entry.id));
      return;
    }

    // Kosong -> tawarkan blokir
    detailBox.style.display = 'block';
    detailBox.innerHTML = `<b>${formatTgl(iso)}</b>Tanggal ini kosong.<br><button class="btn-block" id="btn-block">Blokir Tanggal Ini</button>`;
    document.getElementById('btn-block').addEventListener('click', () => blockDate(iso));
  }

  function formatTgl(iso) {
    return new Date(iso + 'T00:00:00').toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  }

  async function blockDate(iso) {
    try {
      const res = await authFetch('/api/schedule/manual-block', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ crew_id: userId, tanggal_mulai: iso, tanggal_selesai: iso })
      });
      const data = await res.json();
      if (!res.ok) { alert(data.error || 'Gagal memblokir tanggal.'); return; }
      showToast('Tanggal berhasil diblokir.');
      loadSchedule();
    } catch (err) { alert('Tidak bisa terhubung ke server.'); }
  }

  async function unblockDate(id) {
    try {
      const res = await authFetch('/api/schedule/' + id, { method: 'DELETE' });
      const data = await res.json();
      if (!res.ok) { alert(data.error || 'Gagal membuka blokir.'); return; }
      showToast('Blokir tanggal dibuka.');
      loadSchedule();
    } catch (err) { alert('Tidak bisa terhubung ke server.'); }
  }

  async function loadSchedule() {
    const bulan = `${viewYear}-${pad(viewMonth + 1)}`;
    try {
      const res = await authFetch(`/api/schedule/${userId}?bulan=${bulan}`);
      const data = await res.json();
      scheduleData = res.ok ? data.data : [];
    } catch (err) {
      scheduleData = [];
    }
    renderCalendar();
  }

  document.getElementById('btn-prev').addEventListener('click', () => {
    viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    loadSchedule();
  });
  document.getElementById('btn-next').addEventListener('click', () => {
    viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    loadSchedule();
  });

  if (!userId) {
    stateNoLogin.classList.remove('hidden');
  } else {
    stateContent.classList.remove('hidden');
    const now = new Date();
    viewYear = now.getFullYear();
    viewMonth = now.getMonth();
    renderDow();
    loadSchedule();
  }
</script>
</body>
</html>
