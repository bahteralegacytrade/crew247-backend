<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crew247.id - Direktori Kru</title>
  <style>
    :root {
      --bg-page: #0A0D0B; --bg-card: #242C2C; --bg-surface: #171d1d;
      --accent: #E26D0A; --accent-hover: #f07b1a; --secondary: #688273;
      --text-white: #F4F7F5; --text-muted: #A3B5AA; --border-subtle: rgba(104,130,115,.28);
      --ok: #10b981; --ok-bg: rgba(16,185,129,.1); --gold: #FBBF24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-page); color: var(--text-white); margin: 0; padding: 24px 16px; min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 640px; margin: 0 auto; }
    .back-link { color: var(--text-muted); font-size: 13px; text-decoration: none; display: inline-block; margin-bottom: 14px; }
    .back-link:hover { color: var(--accent); }
    .header-card {
      background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 18px;
      padding: 22px 20px; margin-bottom: 18px; position: relative;
      box-shadow: 0 12px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04);
    }
    .header-card::before, .header-card::after {
      content: ""; position: absolute; top: 14px; width: 7px; height: 7px; border-radius: 50%;
      background: #141818; border: 1px solid var(--border-subtle);
    }
    .header-card::before { left: 14px; } .header-card::after { right: 14px; }
    h1 { color: var(--text-white); font-size: 19px; font-weight: 800; margin: 0 0 6px; letter-spacing: -.2px; }
    p.sub { color: var(--text-muted); font-size: 13.5px; margin: 0 0 18px; line-height: 1.5; }
    label {
      display: block; font-size: 10.5px; font-weight: 700; color: var(--secondary);
      margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px;
    }
    input, select {
      width: 100%; background: var(--bg-surface); border: 1px solid var(--border-subtle); color: var(--text-white);
      padding: 10px 12px; border-radius: 9px; font-size: 14px; margin-bottom: 12px; font-family: inherit;
      outline: none; transition: border-color .2s, box-shadow .2s;
    }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(226,109,10,.25); }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button {
      width: 100%; background: var(--accent); color: #fff; border: none; padding: 12px;
      border-radius: 9px; font-weight: 800; font-size: 14.5px; cursor: pointer;
      box-shadow: 0 4px 15px rgba(226,109,10,.3); transition: background .2s, transform .1s;
    }
    button:hover { background: var(--accent-hover); }
    button:active { transform: scale(.99); }
    button:disabled { opacity: .6; cursor: not-allowed; transform: none; }
    .error-box {
      background: rgba(226,109,10,.12); border: 1px solid rgba(226,109,10,.4); color: #ff9b50;
      padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; display: none;
    }
    .meta-info {
      background: var(--bg-surface); border: 1px dashed var(--border-subtle); border-radius: 9px;
      padding: 10px 14px; font-size: 13px; color: var(--text-muted); margin-bottom: 16px; display: none; line-height: 1.5;
    }
    .meta-info b { color: var(--text-white); }
    .no-position-note {
      background: var(--bg-surface); border: 1px dashed var(--border-subtle); border-radius: 9px;
      padding: 10px 14px; font-size: 12.5px; color: var(--text-muted); margin-bottom: 16px;
    }
    .crew-card {
      background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 14px;
      padding: 16px; margin-bottom: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,.35);
    }
    .crew-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .crew-name { font-weight: 700; font-size: 15px; }
    .crew-role { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
    .rating-row { display: flex; align-items: center; gap: 5px; margin-top: 6px; }
    .rating-row .stars { color: var(--gold); font-size: 12px; letter-spacing: 1px; }
    .rating-row .score { font-size: 12.5px; font-weight: 700; color: var(--text-white); }
    .rating-row .count { font-size: 11.5px; color: var(--text-muted); }
    .rate { font-weight: 800; font-size: 14px; color: var(--accent); white-space: nowrap; text-align: right; }
    .rate .unit { font-size: 10px; font-weight: 400; color: var(--text-muted); }
    .tags { margin-top: 10px; }
    .tag {
      display: inline-block; background: var(--bg-surface); border: 1px solid var(--border-subtle);
      color: var(--text-muted); font-size: 10.5px; padding: 3px 8px; border-radius: 6px; margin: 2px 4px 0 0;
    }
    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 13.5px; }
    .btn-pilih { margin-top: 12px; }
    .btn-pilih:disabled { background: var(--ok-bg); color: var(--ok); border: 1px solid rgba(16,185,129,.35); box-shadow: none; opacity: 1; }
    .no-job-text { margin-top: 10px; font-size: 11.5px; color: var(--secondary); font-style: italic; }
    .hidden { display: none; }
  </style>
  <script src="/auth-helper.js"></script>
</head>
<body>
  <div class="wrap">
    <a href="/index.html" class="back-link">&larr; Beranda</a>

    <div class="header-card">
      <h1>Direktori Kru Tersedia</h1>
      <p class="sub">Cari kru panggung profesional yang siap bertugas di rentang tanggal acara Anda.</p>

      <div id="error-box" class="error-box"></div>

      <div class="row2">
        <div>
          <label>Tanggal Mulai *</label>
          <input type="date" id="tanggal_mulai" required>
        </div>
        <div>
          <label>Tanggal Selesai *</label>
          <input type="date" id="tanggal_selesai" required>
        </div>
      </div>

      <label>Peran Utama</label>
      <select id="peran_utama">
        <option value="">Semua Peran</option>
        <option value="FOH Audio Engineer">FOH Audio Engineer</option>
        <option value="Monitor Engineer">Monitor Engineer</option>
        <option value="Lighting Designer">Lighting Designer</option>
        <option value="Stage Manager">Stage Manager</option>
        <option value="Backline Tech">Backline Tech</option>
        <option value="VJ & LED Tech">VJ & LED Tech</option>
      </select>

      <label>Kota Domisili</label>
      <input type="text" id="kota" placeholder="Kosongkan untuk semua kota">

      <button id="btn-cari">Cari Kru Tersedia</button>
    </div>

    <div id="no-position-note" class="no-position-note hidden">
      ℹ️ Buka halaman ini dari <b>Posting Event</b> untuk bisa memilih kru langsung.
    </div>

    <div id="meta-info" class="meta-info"></div>

    <div id="results-container"></div>
  </div>

<script>
  const errorBox = document.getElementById('error-box');
  const metaInfo = document.getElementById('meta-info');
  const resultsContainer = document.getElementById('results-container');
  const noPositionNote = document.getElementById('no-position-note');

  function showError(msg) { errorBox.textContent = msg; errorBox.style.display = 'block'; }
  function hideError() { errorBox.style.display = 'none'; }
  function fmtRupiah(angka) { return 'Rp ' + Number(angka).toLocaleString('id-ID'); }

  const params = new URLSearchParams(window.location.search);
  const qMulai = params.get('tanggal_mulai');
  const qSelesai = params.get('tanggal_selesai');
  const jobPositionId = params.get('job_position_id');

  if (qMulai) document.getElementById('tanggal_mulai').value = qMulai;
  if (qSelesai) document.getElementById('tanggal_selesai').value = qSelesai;

  if (!jobPositionId) {
    noPositionNote.classList.remove('hidden');
  }

  if (qMulai && qSelesai) {
    cariKru();
  }

  document.getElementById('btn-cari').addEventListener('click', cariKru);

  async function cariKru() {
    hideError();
    metaInfo.style.display = 'none';
    resultsContainer.innerHTML = '';

    const tanggalMulai = document.getElementById('tanggal_mulai').value;
    const tanggalSelesai = document.getElementById('tanggal_selesai').value;
    const peranUtama = document.getElementById('peran_utama').value;
    const kota = document.getElementById('kota').value.trim();

    if (!tanggalMulai || !tanggalSelesai) {
      showError('Tanggal mulai dan tanggal selesai wajib diisi.');
      return;
    }

    const btn = document.getElementById('btn-cari');
    btn.disabled = true;
    btn.textContent = 'Mencari...';

    try {
      let url = `/api/crew/directory?tanggal_mulai=${tanggalMulai}&tanggal_selesai=${tanggalSelesai}`;
      if (peranUtama) url += `&peran_utama=${encodeURIComponent(peranUtama)}`;
      if (kota) url += `&kota=${encodeURIComponent(kota)}`;

      const res = await fetch(url);
      const data = await res.json();

      if (!res.ok) {
        showError(data.error || 'Gagal memuat direktori kru.');
        btn.disabled = false;
        btn.textContent = 'Cari Kru Tersedia';
        return;
      }

      const totalTersedia = data.meta.total_kru_tersedia;
      const totalDisembunyikan = data.meta.total_kru_disembunyikan_karena_bentrok;
      const totalKeseluruhan = totalTersedia + totalDisembunyikan;

      metaInfo.innerHTML = `<b>${totalTersedia} dari ${totalKeseluruhan} kru</b> tersedia di tanggal ini. <b>${totalDisembunyikan} kru</b> disembunyikan karena bentrok jadwal.`;
      metaInfo.style.display = 'block';

      if (data.data.length === 0) {
        resultsContainer.innerHTML = `<div class="empty-state">Tidak ada kru tersedia di tanggal ini. Coba tanggal atau filter lain.</div>`;
      } else {
        resultsContainer.innerHTML = data.data.map(renderCrewCard).join('');
        document.querySelectorAll('.btn-pilih').forEach(btn => {
          btn.addEventListener('click', () => pilihKru(btn));
        });
      }

      btn.disabled = false;
      btn.textContent = 'Cari Kru Tersedia';

    } catch (err) {
      showError('Tidak bisa terhubung ke server. Pastikan server backend menyala.');
      btn.disabled = false;
      btn.textContent = 'Cari Kru Tersedia';
    }
  }

  function renderCrewCard(crew) {
    const tags = (crew.keahlian || []).map(k => `<span class="tag">${k}</span>`).join('');

    let actionHtml = '';
    if (jobPositionId) {
      actionHtml = `<button class="btn-pilih" data-crew-id="${crew.user_id}">⚡ Pilih Kru</button>`;
    } else {
      actionHtml = `<div class="no-job-text">Buka dari halaman posting event untuk memilih kru.</div>`;
    }

    const ratingHtml = crew.total_gig_selesai > 0
      ? `<div class="rating-row"><span class="stars">★</span><span class="score">${parseFloat(crew.rating_avg).toFixed(2)}</span><span class="count">(${crew.total_gig_selesai} gig selesai)</span></div>`
      : `<div class="rating-row"><span class="count">Belum ada rating</span></div>`;

    return `
      <div class="crew-card">
        <div class="crew-top">
          <div>
            <div class="crew-name">${crew.nama_lengkap} <span style="color:var(--text-muted); font-weight:400;">(${crew.nama_panggung})</span></div>
            <div class="crew-role">${crew.peran_utama} · ${crew.kota}</div>
            ${ratingHtml}
          </div>
          <div class="rate">${fmtRupiah(crew.rate_harian)}<br><span class="unit">/hari</span></div>
        </div>
        <div class="tags">${tags}</div>
        ${actionHtml}
      </div>
    `;
  }

  async function pilihKru(btn) {
    const crewId = btn.getAttribute('data-crew-id');
    btn.disabled = true;
    btn.textContent = 'Mengirim...';

    try {
      const res = await authFetch('/api/applications', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          job_position_id: jobPositionId,
          crew_id: crewId,
          sumber: 'colek_langsung'
        })
      });
      const data = await res.json();

      if (!res.ok) {
        alert(data.error || 'Gagal mengirim tawaran ke kru ini.');
        btn.disabled = false;
        btn.textContent = '⚡ Pilih Kru';
        return;
      }

      btn.textContent = '✓ Menunggu Respons Kru';

    } catch (err) {
      alert('Tidak bisa terhubung ke server.');
      btn.disabled = false;
      btn.textContent = '⚡ Pilih Kru';
    }
  }
</script>
</body>
</html>
