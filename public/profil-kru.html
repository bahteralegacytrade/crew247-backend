<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crew247.id - Profil & CV Digital</title>
  <script src="/auth-helper.js"></script>
  <style>
    :root {
      --bg-page: #0A0D0B; --bg-card: #242C2C; --bg-surface: #171d1d; --bg-quote: #393720;
      --accent: #E26D0A; --accent-hover: #f07b1a; --secondary: #688273; --secondary-light: #8da697;
      --text-white: #F4F7F5; --text-muted: #A3B5AA;
      --border-subtle: rgba(104, 130, 115, 0.28); --border-active: rgba(226, 109, 10, 0.5);
      --ok: #10b981; --danger: #f0725c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-page); color: var(--text-white);
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; padding: 24px 16px; -webkit-font-smoothing: antialiased;
    }
    .brand-top { text-align: center; margin-bottom: 14px; }
    .brand-top .logo-text {
      font-size: 20px; font-weight: 900; letter-spacing: 0.8px; color: var(--text-white);
      text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
    }
    .brand-top .logo-text span { color: var(--accent); }
    .back-link {
      display: block; text-align: center; color: var(--text-muted); font-size: 12.5px;
      text-decoration: none; margin-bottom: 16px; transition: color 0.2s;
    }
    .back-link:hover { color: var(--accent); }

    .card {
      background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 18px;
      padding: 28px 24px; width: 100%; max-width: 440px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.04);
      position: relative; margin-bottom: 20px;
    }
    .card::before, .card::after {
      content: ""; position: absolute; top: 14px; width: 7px; height: 7px; border-radius: 50%;
      background: #141818; border: 1px solid var(--border-subtle);
    }
    .card::before { left: 14px; } .card::after { right: 14px; }

    h1 { font-size: 20px; font-weight: 800; margin: 0 0 6px; letter-spacing: -0.2px; }
    p.sub { color: var(--text-muted); font-size: 13px; margin: 0 0 20px; line-height: 1.5; }
    a { color: var(--accent); }

    label {
      display: block; font-size: 11px; font-weight: 700; color: var(--secondary);
      margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.6px;
    }
    input, select, textarea {
      width: 100%; background: var(--bg-surface); border: 1px solid var(--border-subtle);
      color: var(--text-white); padding: 11px 13px; border-radius: 10px; font-size: 14.5px;
      margin-bottom: 14px; font-family: inherit; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent); box-shadow: 0 0 0 2px rgba(226,109,10,0.25);
    }
    textarea { resize: vertical; min-height: 70px; }

    button {
      width: 100%; background: var(--accent); color: #fff; border: none; padding: 13px;
      border-radius: 10px; font-weight: 800; font-size: 14.5px; cursor: pointer;
      box-shadow: 0 4px 15px rgba(226,109,10,0.35); transition: background 0.2s, transform 0.1s;
      margin-top: 4px;
    }
    button:hover { background: var(--accent-hover); }
    button:active { transform: scale(0.99); }
    button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .error-box {
      background: rgba(226,109,10,0.12); border: 1px solid rgba(226,109,10,0.4); color: #ff9b50;
      padding: 10px 12px; border-radius: 9px; font-size: 13px; margin-bottom: 16px; display: none; line-height: 1.4;
    }
    .success-box {
      background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.4); color: var(--ok);
      padding: 10px 12px; border-radius: 9px; font-size: 13px; margin-bottom: 16px; display: none; line-height: 1.4;
    }
    .hidden { display: none !important; }

    .foto-row { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
    .foto-row img, .foto-row .placeholder {
      width: 64px; height: 64px; border-radius: 50%; object-fit: cover;
      background: var(--bg-surface); border: 2px solid var(--border-subtle);
      display: flex; align-items: center; justify-content: center; font-size: 10.5px; color: var(--secondary);
      flex-shrink: 0;
    }
    input[type="file"] { background: none; border: none; padding: 0; margin: 0; font-size: 12.5px; color: var(--text-muted); }

    .center-card { text-align: center; }
  </style>
</head>
<body>

  <div class="brand-top">
    <a href="/index.html" class="logo-text">CREW247<span>.ID</span></a>
  </div>
  <a href="/index.html" class="back-link">&larr; Beranda</a>

  <!-- STATE: Belum login -->
  <div class="card center-card" id="state-no-login">
    <h1>Akses Ditolak</h1>
    <p class="sub">Anda belum masuk ke dalam sistem Crew247.id.</p>
    <a href="/login.html">Silakan login dulu di sini &rarr;</a>
  </div>

  <!-- STATE: Form profil -->
  <div class="card hidden" id="state-form">
    <h1 id="form-title">Lengkapi CV Digital</h1>
    <p class="sub">Buat profil profesional Anda agar pembuat event dapat menemukan Anda.</p>

    <div id="error-box" class="error-box"></div>
    <div id="success-box" class="success-box"></div>

    <form id="profile-form">
      <div class="foto-row">
        <img id="foto-preview" src="" alt="" style="display:none;">
        <div id="foto-placeholder" class="placeholder">Belum ada</div>
        <input type="file" id="foto_input" accept="image/*">
      </div>
      <input type="hidden" id="foto_url">

      <label>Nama Lengkap *</label>
      <input type="text" id="nama_lengkap" required>

      <label>Nama Panggung / Panggilan *</label>
      <input type="text" id="nama_panggung" required>

      <label>Peran Utama *</label>
      <select id="peran_utama" required>
        <option value="">-- Pilih Peran --</option>
        <option value="FOH Audio Engineer">FOH Audio Engineer</option>
        <option value="Monitor Engineer">Monitor Engineer</option>
        <option value="Lighting Designer">Lighting Designer</option>
        <option value="Stage Manager">Stage Manager</option>
        <option value="Backline Tech">Backline Tech</option>
        <option value="VJ & LED Tech">VJ & LED Tech</option>
      </select>

      <label>Kota Domisili *</label>
      <input type="text" id="kota" required>

      <label>Rate Harian (IDR) *</label>
      <input type="number" id="rate_harian" required>

      <label>Pengalaman (Tahun) *</label>
      <input type="number" id="pengalaman_tahun">

      <label>Keahlian Alat / Software (dipisah koma)</label>
      <input type="text" id="keahlian" placeholder="Yamaha CL5, DiGiCo SD Series">

      <label>Bio Singkat / Deskripsi Profesional</label>
      <textarea id="bio"></textarea>

      <button type="submit" id="btn-submit">Simpan Profil</button>
    </form>
  </div>

<script>
  const userId = localStorage.getItem('crew247_user_id');

  const stateNoLogin = document.getElementById('state-no-login');
  const stateForm = document.getElementById('state-form');
  const errorBox = document.getElementById('error-box');
  const successBox = document.getElementById('success-box');
  const formTitle = document.getElementById('form-title');

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = 'block';
    successBox.style.display = 'none';
  }
  function showSuccess(msg) {
    successBox.textContent = msg;
    successBox.style.display = 'block';
    errorBox.style.display = 'none';
  }

  if (!userId) {
    stateNoLogin.classList.remove('hidden');
  } else {
    stateForm.classList.remove('hidden');
    loadExistingProfile();
  }

    document.getElementById('foto_input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const img = new Image();
    const reader = new FileReader();

    reader.onload = (ev) => {
      img.onload = () => {
        const size = 256;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        const minSide = Math.min(img.width, img.height);
        const sx = (img.width - minSide) / 2;
        const sy = (img.height - minSide) / 2;
        ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);

        const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
        document.getElementById('foto_url').value = dataUrl;

        const preview = document.getElementById('foto-preview');
        preview.src = dataUrl;
        preview.style.display = 'block';
        document.getElementById('foto-placeholder').style.display = 'none';
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  async function loadExistingProfile() {
    try {
      const res = await authFetch('/api/crew/profile/' + userId);

      if (res.status === 404) {
        formTitle.textContent = 'Lengkapi CV Digital';
        return;
      }

      if (!res.ok) {
        showError('Gagal memuat data profil.');
        return;
      }

      const result = await res.json();
      const data = result.data;

      formTitle.textContent = 'Edit CV Digital';
      document.getElementById('nama_lengkap').value = data.nama_lengkap || '';
      document.getElementById('nama_panggung').value = data.nama_panggung || '';
      document.getElementById('peran_utama').value = data.peran_utama || '';
      document.getElementById('kota').value = data.kota || '';
      document.getElementById('rate_harian').value = data.rate_harian || '';
      document.getElementById('pengalaman_tahun').value = data.pengalaman_tahun || '';
      document.getElementById('keahlian').value = (data.keahlian || []).join(', ');
      document.getElementById('bio').value = data.bio || '';
      document.getElementById('foto_url').value = data.foto_url || '';
      if (data.foto_url) {
        const preview = document.getElementById('foto-preview');
        preview.src = data.foto_url;
        preview.style.display = 'block';
        document.getElementById('foto-placeholder').style.display = 'none';
      }

    } catch (err) {
      showError('Tidak bisa terhubung ke server. Pastikan server backend menyala.');
    }
  }

  document.getElementById('profile-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    successBox.style.display = 'none';

    const keahlianArray = document.getElementById('keahlian').value
      .split(',')
      .map(s => s.trim())
      .filter(s => s.length > 0);

    const payload = {
      user_id: userId,
      nama_lengkap: document.getElementById('nama_lengkap').value.trim(),
      nama_panggung: document.getElementById('nama_panggung').value.trim(),
      peran_utama: document.getElementById('peran_utama').value,
      kota: document.getElementById('kota').value.trim(),
      rate_harian: parseInt(document.getElementById('rate_harian').value) || 0,
      pengalaman_tahun: parseInt(document.getElementById('pengalaman_tahun').value) || 0,
      keahlian: keahlianArray,
      bio: document.getElementById('bio').value.trim(),
      foto_url: document.getElementById('foto_url').value.trim() || null
    };

    const btn = document.getElementById('btn-submit');
    btn.disabled = true;
    btn.textContent = 'Menyimpan...';

    try {
      const res = await authFetch('/api/crew/profile', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (!res.ok) {
        showError(data.error || 'Gagal menyimpan profil.');
        btn.disabled = false;
        btn.textContent = 'Simpan Profil';
        return;
      }

      showSuccess('Profil berhasil disimpan! CV digital Anda sudah aktif di Crew247.id.');
      formTitle.textContent = 'Edit CV Digital';
      btn.disabled = false;
      btn.textContent = 'Simpan Profil';

    } catch (err) {
      showError('Tidak bisa terhubung ke server. Pastikan server backend menyala.');
      btn.disabled = false;
      btn.textContent = 'Simpan Profil';
    }
  });
</script>

</body>
</html>
